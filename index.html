<script>
/* Theme bootstrap. Must run before first paint to avoid a flash. */
(function(){
  try {
    var saved = localStorage.getItem("thk-theme");
    var t = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme","light"); }
})();
</script>

<body>

</noscript>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="topbar__name" href="#top" id="topbar-name"></a>

    <div class="langs" id="langs" hidden></div>

</main>

<!-- Section templates. No content strings, structure only. -->
<template id="tpl-section">
  <section class="section">
    <div class="wrap">
      <div class="section__head">
        <p class="eyebrow" data-slot="eyebrow"></p>
        <h2 class="section__title" data-slot="title"></h2>
        <p class="section__intro" data-slot="intro" hidden></p>
      </div>
      <div data-slot="body"></div>
    </div>

</template>
